<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wishlist Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5fa;--surface:#fff;--ink:#14213d;--muted:#56627e;--line:#d3dbea;--accent:#f4a300;--rim:#14213d;--seg-ink:#10182b;--seg-line:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1120;--surface:#151d33;--ink:#eaf0ff;--muted:#9aa8c8;--line:#28345a;--rim:#2b3a66;--seg-line:#151d33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1120;--surface:#151d33;--ink:#eaf0ff;--muted:#9aa8c8;--line:#28345a;--rim:#2b3a66;--seg-line:#151d33;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.app{max-width:560px;margin:0 auto;padding:22px 16px 40px;display:flex;flex-direction:column;align-items:center;gap:20px}
header{width:100%}
h1{margin:0;font-size:clamp(1.9rem,7vw,3rem);font-weight:800;letter-spacing:-.03em;line-height:1}
header p{margin:8px 0 0;color:var(--muted)}
.wheelbox{width:100%;aspect-ratio:1}
canvas{width:100%;height:100%;display:block}
.spin{font:inherit;font-size:1.25rem;font-weight:800;letter-spacing:.04em;background:var(--accent);color:#1a1200;border:2px solid var(--ink);border-radius:999px;padding:14px 56px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.spin:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.spin:disabled{opacity:.55;cursor:not-allowed}
.spin:focus-visible,.buy:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#result{width:100%}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:16px;display:flex;gap:16px;align-items:center}
.card[hidden]{display:none}
.tile{position:relative;flex:none;width:96px;height:96px;border-radius:10px;overflow:hidden;display:grid;place-items:center;font-size:2.6rem;font-weight:800;color:var(--seg-ink);border:2px solid var(--ink)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.info{min-width:0}
.info h2{margin:0;font-size:1.2rem;line-height:1.2;overflow-wrap:anywhere}
.price{margin:6px 0 10px;font-size:1.5rem;font-weight:800}
.buy{display:inline-block;font-weight:600;color:var(--ink);background:var(--surface);border:2px solid var(--ink);border-radius:10px;padding:9px 16px;text-decoration:none}
.buy:hover{background:var(--line)}
.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}
[hidden]{display:none!important}
.acts{display:flex;flex-wrap:wrap;gap:10px}
button.buy{font:inherit;font-weight:600;cursor:pointer}
.opts{width:100%;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:.92rem;color:var(--muted)}
.opts input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:5px 8px;min-width:0}
.opts .tag input{width:9em}
.opts .wide{flex:1 1 100%;display:flex;gap:8px}.opts .wide input{flex:1}
.opts button{font:inherit;font-size:.88rem;color:var(--ink);background:none;border:2px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
#msg{width:100%;margin:0;min-height:1.3em;color:var(--muted);font-size:.9rem}
#hh{width:100%}#hh h3{margin:0 0 6px;font-size:1rem}#hist{margin:0;padding-left:20px;color:var(--muted)}
#conf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.spin{transition:none}}
</style>
</head>
<body>
<main class="app">
<header>
<h1>Wishlist Wheel</h1>
<p>Spin the wheel to pick something from my wishlist.</p>
</header>
<div class="wheelbox"><canvas id="wheel" role="img" aria-label="Wheel of wishlist items"></canvas></div>
<button class="spin" id="spin" type="button">SPIN</button>
<div class="opts">
<label><input type="checkbox" id="mute"> Mute</label>
<label><input type="checkbox" id="rm"> Remove won items</label>
<label><input type="checkbox" id="wt"> Weight by price</label>
<label class="tag">Associate tag <input type="text" id="tag" autocomplete="off" placeholder="optional"></label>
<button id="reset" type="button">Restore items</button>
<div class="wide" id="load"><input type="text" id="url" placeholder="Wishlist URL, or pasted JSON" aria-label="Wishlist URL or pasted JSON"><button id="go" type="button">Load</button></div>
</div>
<p id="msg" role="status"></p>
<div id="result" aria-live="polite">
<div class="card" id="card" hidden>
<div class="tile" id="tile"></div>
<div class="info"><h2 id="rt"></h2><p class="price" id="rp"></p><div class="acts"><a class="buy" id="buy" target="_blank" rel="noopener">Add to Amazon cart</a><button class="buy" id="again" type="button">Spin again</button></div></div>
</div>
</div>
<section id="hh" hidden><h3>Recent spins</h3><ol id="hist"></ol></section>
<canvas id="conf" aria-hidden="true"></canvas>
</main>
